# Compile OptiWin sur un Windows de GitHub avec le compilateur C# fourni avec Windows (build.ps1),
# lance les auto-tests, puis publie la release quand un tag « vAA.MM.N » est poussé.
# Si les auto-tests échouent, la release est créée en brouillon : rien n'est publié sans un regard humain.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release à créer sur ce commit, ex. v26.11.1 (vide : compilation et tests seulement)"
        required: false
        default: ''

permissions:
  contents: write

env:
  # Tag poussé, ou tag demandé à la main : vide pour une simple compilation.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Compiler, tester, publier
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Compiler avec le csc de Windows
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Vérifier la version de l'exécutable
        shell: pwsh
        run: |
          $v = (Get-Item dist\OptiWin.exe).VersionInfo
          "Version du fichier : $($v.FileVersion) - $((Get-Item dist\OptiWin.exe).Length) octets"
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag attendu sous la forme vAA.MM.N, reçu : $env:RELEASE_TAG" }
            $tag = $env:RELEASE_TAG.TrimStart('v')
            $file = $v.FileVersion -replace '\.0$', ''
            if ($file -ne $tag) { throw "Le tag v$tag ne correspond pas à la version compilée $($v.FileVersion) : corrigez Program.cs ou le tag." }
            "Release demandée : $env:RELEASE_TAG"
          }

      - name: Auto-tests (sans effet sur le système)
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\OptiWin.exe).Path
          $log = Join-Path $PWD 'selftest.log'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', '--log', "`"$log`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(1200000)) { try { $p.Kill() } catch {}; throw 'Auto-tests interrompus après 20 minutes.' }
          if (Test-Path $log) { Get-Content $log } else { 'Aucun journal produit.' }
          if ($null -eq $p.ExitCode) { throw 'Code de retour des auto-tests inconnu.' }
          exit $p.ExitCode

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\OptiWin.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS.txt'), "$h  OptiWin.exe`n")
          Get-Content dist\SHA256SUMS.txt

      - name: Résumé
        if: always()
        shell: pwsh
        run: |
          $ok = '${{ steps.selftest.outcome }}' -eq 'success'
          $lines = @('## OptiWin', '', '- Compilation : réussie', ('- Auto-tests : ' + $(if ($ok) { 'réussis' } else { '**en échec** : voir selftest.log dans les artefacts' })))
          if (Test-Path selftest.log) { $lines += ''; $lines += '```text'; $lines += (Get-Content selftest.log | Select-Object -Last 6); $lines += '```' }
          $lines -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiWin-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            dist/OptiWin.exe
            dist/SHA256SUMS.txt
            selftest.log

      - name: Notes de version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, '(?ms)^## ' + [regex]::Escape($ver) + '[ \t]*\r?$(.*?)(?=^## |\z)')
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'Voir CHANGELOG.md.' }
          $hash = (Get-Content dist\SHA256SUMS.txt -Raw).Split(' ')[0]
          $body = (Get-Content .github\RELEASE_TEMPLATE.md -Raw).Replace('{{VERSION}}', $ver).Replace('{{CHANGES}}', $changes).Replace('{{SHA256}}', $hash)
          if ('${{ steps.selftest.outcome }}' -ne 'success') {
            $body = "> **Brouillon : les auto-tests ont échoué sur le serveur de compilation. Lisez selftest.log dans les artefacts du workflow avant de publier.**`n`n" + $body
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release-body.md'), $body, [Text.UTF8Encoding]::new($false))
          "VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Content release-body.md

      - name: Release GitHub
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: OptiWin ${{ env.VERSION }}
          body_path: release-body.md
          draft: ${{ steps.selftest.outcome != 'success' }}
          fail_on_unmatched_files: true
          files: |
            dist/OptiWin.exe
            dist/SHA256SUMS.txt
